# Wrapper so the lock screen shows the current wallpaper (see
# custom/scripts/lock.sh and the source line in hyprlock.conf).
$lock_cmd = pidof hyprlock || ~/.config/hypr/custom/scripts/lock.sh

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# suspend disabled: s2idle hangs this machine (PM: suspend entry, never exits)
